# =====================================================================
# "h2" profile: in-memory database, no MySQL needed.
# Run:  mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# Data is lost when the app stops (the demo data is re-seeded on every start).
# =====================================================================
spring.datasource.url=jdbc:h2:mem:fitflex_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Browser console at http://localhost:8080/h2-console  (JDBC URL as above, user "sa", no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
