# =====================================================================
# FitFlex backend configuration.
# Every value can be overridden by an environment variable, or by a line
# in the gitignored file backend/.env (copy .env.example to start).
# Syntax reminder: ${ENV_NAME:default} = use ENV_NAME if set, else default.
# =====================================================================
spring.application.name=fitflex-backend

# Load backend/.env if it exists (path is relative to where you run mvnw).
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---------- Database (MySQL 8 by default) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitflex_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the @Entity classes automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Services load everything they need inside a transaction and return DTOs,
# so the "open session in view" anti-pattern is switched off.
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Kolkata

# ---------- Security / JWT ----------
# Leave JWT_SECRET empty in development and a random key is generated at startup
# (tokens then stop working after a restart). Set a long random value for real use.
fitflex.jwt.secret=${JWT_SECRET:}
fitflex.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend origins allowed to call the API (comma separated). Default = VS Code Live Server.
fitflex.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# ---------- File uploads (trainer resources) ----------
fitflex.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ---------- External APIs (all optional: the app falls back without keys) ----------
fitflex.spoonacular.api-key=${SPOONACULAR_API_KEY:}
fitflex.spoonacular.base-url=https://api.spoonacular.com
fitflex.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
# Overpass (OpenStreetMap) mirrors, all asked in parallel; the first good answer wins.
fitflex.overpass.urls=${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter,https://overpass.kumi.systems/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter}
# Give up on Overpass after this many seconds and use Nominatim instead.
fitflex.overpass.deadline-seconds=30
fitflex.nominatim.url=https://nominatim.openstreetmap.org/search

# ---------- Gym search reliability ----------
# Last good results per location are saved here and shown if every map service is down.
fitflex.gym.cache-file=${GYM_CACHE_FILE:data/gym-cache.json}
# Search the default city (Nagpur) in the background at startup so the gyms page is instant.
fitflex.gym.warm-up=${GYM_WARM_UP:true}
fitflex.gym.default-lat=21.1458
fitflex.gym.default-lng=79.0882

# Seed demo users, trainers and data when the database is empty.
fitflex.seed.enabled=${SEED_DEMO_DATA:true}
