<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with the FitFlex team.">
  <title>Contact | FitFlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main>
    <section class="page-header">
      <div class="container"><div><h1>Contact us</h1><p>Questions, feedback or want to join as a trainer? Write to us.</p></div></div>
    </section>
    <div class="container">
      <div class="layout-sidebar">
        <div class="card">
          <form id="contact-form" novalidate>
            <div class="form-row">
              <div class="form-group"><label for="name">Your name <span class="req">*</span></label><input id="name" name="name" required maxlength="100" autocomplete="name"></div>
              <div class="form-group"><label for="email">Email <span class="req">*</span></label><input type="email" id="email" name="email" required maxlength="150" autocomplete="email"></div>
            </div>
            <div class="form-group"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="150"></div>
            <div class="form-group"><label for="message">Message <span class="req">*</span></label><textarea id="message" name="message" required minlength="10" maxlength="2000"></textarea></div>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Send message</button>
          </form>
        </div>
        <aside class="stack">
          <div class="card"><div class="card-icon"><i class="fa-solid fa-envelope"></i></div><h3>Email</h3><p class="muted mb-0">support@fitflex.example</p></div>
          <div class="card"><div class="card-icon"><i class="fa-solid fa-location-dot"></i></div><h3>Campus</h3><p class="muted mb-0">Department of Computer Engineering<br>Nagpur, Maharashtra</p></div>
          <div class="card"><div class="card-icon"><i class="fa-solid fa-clock"></i></div><h3>Response time</h3><p class="muted mb-0">Usually within 1-2 working days.</p></div>
        </aside>
      </div>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast-container" aria-live="polite"></div>


  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/contact.js"></script>
</body>
</html>
