<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your FitFlex member account.">
  <title>Sign Up | FitFlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="user">
  <header id="navbar" class="navbar"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="card form-card wide reveal">
          <div class="text-center mb-2">
            <h1 style="font-size: 1.8rem;">Create your account</h1>
            <p class="muted">We use your details to personalise sessions and diet plans.</p>
          </div>
          <form id="register-form" novalidate>
            <fieldset>
              <legend>Account</legend>
              <div class="form-group">
                <label for="fullName">Full name <span class="req">*</span></label>
                <input id="fullName" name="fullName" required maxlength="100" autocomplete="name" placeholder="e.g. Rahul Verma">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="email">Email <span class="req">*</span></label>
                  <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                  <label for="phone">Phone</label>
                  <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="9876543210">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="password">Password <span class="req">*</span></label>
                  <input type="password" id="password" name="password" required data-validate="password" autocomplete="new-password">
                  <div class="form-hint">At least 8 characters, including a number</div>
                </div>
                <div class="form-group">
                  <label for="confirmPassword">Confirm password <span class="req">*</span></label>
                  <input type="password" id="confirmPassword" name="confirmPassword" required data-match="password" autocomplete="new-password">
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>Body</legend>
              <div class="form-row">
                <div class="form-group">
                  <label for="age">Age <span class="req">*</span></label>
                  <input type="number" id="age" name="age" required min="13" max="100" placeholder="24">
                </div>
                <div class="form-group">
                  <label for="gender">Gender <span class="req">*</span></label>
                  <select id="gender" name="gender" required>
                    <option value="">Select...</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="heightCm">Height (cm) <span class="req">*</span></label>
                  <input type="number" id="heightCm" name="heightCm" required data-validate="positive" step="0.1" placeholder="175">
                </div>
                <div class="form-group">
                  <label for="weightKg">Weight (kg) <span class="req">*</span></label>
                  <input type="number" id="weightKg" name="weightKg" required data-validate="positive" step="0.1" placeholder="72">
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>Goals</legend>
              <div class="form-row">
                <div class="form-group">
                  <label for="fitnessGoal">Fitness goal <span class="req">*</span></label>
                  <select id="fitnessGoal" name="fitnessGoal" required>
    <option value="">Select...</option>
    <option value="WEIGHT_LOSS">Weight loss</option>
    <option value="MUSCLE_GAIN">Muscle gain</option>
    <option value="MAINTENANCE">Maintenance</option></select>
                </div>
                <div class="form-group">
                  <label for="fitnessLevel">Fitness level <span class="req">*</span></label>
                  <select id="fitnessLevel" name="fitnessLevel" required>
    <option value="">Select...</option>
    <option value="BEGINNER">Beginner</option>
    <option value="INTERMEDIATE">Intermediate</option>
    <option value="ADVANCED">Advanced</option></select>
                </div>
              </div>
              <div class="form-group">
                <label for="activityLevel">Activity level <span class="req">*</span></label>
                <select id="activityLevel" name="activityLevel" required>
    <option value="">Select...</option>
    <option value="SEDENTARY">Sedentary (desk job, little exercise)</option>
    <option value="LIGHT">Light (exercise 1-3 days/week)</option>
    <option value="MODERATE">Moderate (exercise 3-5 days/week)</option>
    <option value="ACTIVE">Active (hard exercise 6-7 days/week)</option>
    <option value="VERY_ACTIVE">Very active (physical job or 2x training)</option></select>
              </div>
            </fieldset>

            <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-user-plus"></i> Create account</button>
          </form>
          <p class="form-footer">Already have an account? <a href="login.html">Log in</a><br>Are you a coach? <a href="trainer-register.html">Join as a trainer</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast-container" aria-live="polite"></div>


  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
