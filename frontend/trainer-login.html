<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to the FitFlex trainer portal.">
  <title>Trainer Login | FitFlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="trainer">
  <header id="navbar" class="navbar"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="card form-card reveal">
          <div class="text-center mb-2">
            <div class="card-icon" style="margin: 0 auto 12px;"><i class="fa-solid fa-id-badge"></i></div>
            <h1 style="font-size: 1.8rem;">Trainer portal</h1>
            <p class="muted">Log in to manage your clients and sessions.</p>
          </div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email <span class="req">*</span></label>
              <div class="input-icon"><i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com"></div>
            </div>
            <div class="form-group">
              <label for="password">Password <span class="req">*</span></label>
              <div class="input-icon"><i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-right-to-bracket"></i> Log in</button>
          </form>

          <div class="alert alert-info mt-3">
            <i class="fa-solid fa-flask"></i>
            <div>Demo account: <code>trainer1@fitflex.com</code> / <code>Trainer@1234</code>
              <button type="button" class="btn btn-ghost btn-sm mt-1" id="fill-demo" data-email="trainer1@fitflex.com" data-password="Trainer@1234">Fill demo login</button></div>
          </div>

          <p class="form-footer">New here? <a href="trainer-register.html">Create an account</a><br>Looking for the other portal? <a href="login.html">Member login</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast-container" aria-live="polite"></div>


  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
