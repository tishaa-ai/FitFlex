<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your workouts, weight and form accuracy.">
  <title>My Progress | FitFlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <div><h1>My progress</h1><p>Every log counts. Keep the streak alive!</p></div>
      </div>
    </section>

    <div class="container">
      <div id="summary" class="grid grid-4 mb-2"></div>

      <div class="layout-sidebar mt-3">
        <div class="stack">
          <div class="card"><div class="card-header"><h3>Weight over time</h3></div><div class="chart-box"><canvas id="weight-chart"></canvas></div></div>
          <div class="card"><div class="card-header"><h3>Workout minutes per week</h3></div><div class="chart-box"><canvas id="minutes-chart"></canvas></div></div>
          <div class="card"><div class="card-header"><h3>Pose detection form accuracy</h3></div><div class="chart-box"><canvas id="form-chart"></canvas></div></div>
        </div>
        <aside class="card">
          <h3><i class="fa-solid fa-pen-to-square accent"></i> Log today</h3>
          <form id="progress-form" novalidate>
            <div class="form-group"><label for="date">Date</label><input type="date" id="date" name="date"></div>
            <div class="form-row">
              <div class="form-group"><label for="weightKg">Weight (kg)</label><input type="number" id="weightKg" name="weightKg" step="0.1" data-validate="positive" max="400"></div>
              <div class="form-group"><label for="workoutMinutes">Workout (min)</label><input type="number" id="workoutMinutes" name="workoutMinutes" min="0" max="600"></div>
            </div>
            <div class="form-group"><label for="caloriesBurned">Calories burned</label><input type="number" id="caloriesBurned" name="caloriesBurned" min="0" max="10000"></div>
            <div class="form-group"><label for="notes">Notes</label><textarea id="notes" name="notes" maxlength="500" placeholder="How did it go?"></textarea></div>
            <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save entry</button>
            <p class="form-hint">Enter your weight, workout minutes, or both.</p>
          </form>
        </aside>
      </div>

      <div class="card mt-3">
        <div class="card-header"><h3>Recent entries</h3><span class="muted small">Latest 20</span></div>
        <div id="entries" class="table-wrap"></div>
      </div>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast-container" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/progress.js"></script>
</body>
</html>
