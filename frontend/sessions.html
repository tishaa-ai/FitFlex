<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your FitFlex training sessions.">
  <title>My Sessions | FitFlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <div><h1>My sessions</h1><p id="sessions-sub">Join your confirmed sessions with one click.</p></div>
        <a href="trainers.html" class="btn btn-primary" id="book-btn"><i class="fa-solid fa-calendar-plus"></i> Book a session</a>
      </div>
    </section>

    <div class="container">
      <div id="session-tabs">
        <div class="tabs">
          <button class="tab active" data-tab="tab-upcoming"><i class="fa-solid fa-calendar-day"></i> Upcoming</button>
          <button class="tab" data-tab="tab-past"><i class="fa-solid fa-clock-rotate-left"></i> Past &amp; cancelled</button>
          <button class="tab" data-tab="tab-group" id="group-tab-btn"><i class="fa-solid fa-people-group"></i> Group classes</button>
        </div>
        <div class="tab-panel active" id="tab-upcoming"><div id="upcoming-list" class="grid grid-auto"></div></div>
        <div class="tab-panel" id="tab-past"><div id="past-list" class="grid grid-auto"></div></div>
        <div class="tab-panel" id="tab-group">
          <p class="muted">Upcoming group classes from all trainers. Join for free; the video link appears once you have joined.</p>
          <div id="group-list" class="grid grid-auto"></div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast-container" aria-live="polite"></div>


  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/sessions.js"></script>
</body>
</html>
